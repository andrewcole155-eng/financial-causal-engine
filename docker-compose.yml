services:
  app:
    build: .
    container_name: financial-app
    ports:
      - "8501:8501"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=AxMRXm1AVaAe9MOuLDIn4whN1vCIqnBVPG0Wv1Vt-zg
    # --- ADDED THIS SECTION to share the SQLite database ---
    volumes:
      - ./shared_data:/app/database

  neo4j:
    image: neo4j:5
    container_name: neo4j-db
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Driver
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/AxMRXm1AVaAe9MOuLDIn4whN1vCIqnBVPG0Wv1Vt-zg
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p AxMRXm1AVaAe9MOuLDIn4whN1vCIqnBVPG0Wv1Vt-zg 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    container_name: financial-worker
    command: python worker.py
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=AxMRXm1AVaAe9MOuLDIn4whN1vCIqnBVPG0Wv1Vt-zg
    # --- ADDED THIS SECTION to share the SQLite database ---
    volumes:
      - ./shared_data:/app/database