name: Pre-compute and Cache Graph

on:
  schedule:
    # This runs at 9:00 AM Brisbane time (23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  build_graph:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install yfinance
          
          # --- FIX: Download the required NLP Model ---
          python -m spacy download en_core_web_sm
          # ------------------------------------------

          # We uninstall Streamlit here to force all subsequent scripts 
          # to rely on Environment Variables instead of st.secrets
          pip uninstall -y streamlit

      # --- STEP 1: FETCH DATA (The Bucket) ---
      - name: 1. Fetch Fresh Data (Worker)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          EMAIL_SERVER: ${{ secrets.EMAIL_SERVER }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python worker.py

      # --- STEP 2: WRITE TO NEO4J (The Pump) ---
      - name: 2. Sync SQLite to Neo4j (Backfill)
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: python backfill.py

      # --- STEP 3: CALCULATE GRAPH (The Camera) ---
      - name: 3. Run Pre-computation Script
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: python precompute_graph.py

      # --- STEP 4: SAVE CHANGES ---
      - name: Commit and Push Graph
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 1. Add only the graph file we care about
          git add financial_graph.gml
          
          # 2. Check if there are changes to that file; if not, exit cleanly
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Update pre-computed graph with fresh data"
          
          # 3. CRITICAL FIX: Stash (hide) any other dirty files (pycache, logs)
          # This ensures the directory is clean so rebase works.
          git stash --include-untracked
          
          # 4. Pull the latest changes from remote and reapply our commit on top
          git pull --rebase origin main
          
          git push