name: Pre-compute and Cache Graph

on:
  schedule:
    # This runs at 9:00 AM Brisbane time (23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  build_graph:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Match your app's version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # You must list all required libraries here
          pip install networkx pandas neo4j

      - name: Run Pre-computation Script
        # This step provides the Neo4j secrets to the script
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          # This runs the new script, which can take a long time
          python precompute_graph.py
      
      # This step is critical: it saves the file.
      # But Streamlit Cloud won't see it unless you deploy.
      # A better way is to push the file back to the repo.
      
      - name: Commit and push the graph file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add financial_graph.gml
          # Check if there are changes to commit
          git diff --staged --quiet || git commit -m "Update pre-computed graph"
          git push