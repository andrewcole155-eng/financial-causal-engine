name: Pre-compute and Cache Graph

on:
  schedule:
    # This runs at 9:00 AM Brisbane time (23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  build_graph:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          echo "--- 1. Checking pip configuration ---"
          pip config list -v
          
          echo "--- 2. Checking available py2neo versions from pip's index ---"
          pip index versions py2neo
          
          echo "--- 3. Now, attempting the install again (with -vvv) ---"
          pip install -vvv --no-cache-dir --ignore-installed --index-url https://pypi.org/simple py2neo==2024.1.1
          
          echo "--- 4. Installing remaining packages ---"
          pip install --no-cache-dir -r requirements.txt

      # --- THIS IS THE UPDATED STEP ---
      - name: Force script to read config.json
        run: |
          # This prevents database_manager from trying to read st.secrets
          pip uninstall -y streamlit
      # --- END OF UPDATED STEP ---

      - name: Run Pre-computation Script
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python precompute_graph.py
      
      - name: Commit and push the graph file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add financial_graph.gml
          # Check if there are changes to commit
          git diff --staged --quiet || git commit -m "Update pre-computed graph"
          git push